services:
  postgres:
    image: postgres:16-alpine
    container_name: arqon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arqon_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-arqon_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - arqon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: arqon_redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - arqon_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  migrate:
    build:
      context: .
      target: bot
    container_name: arqon_migrate
    restart: "no"
    command: ["node", "dist/infra/db/migrate.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-arqon_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-arqon_db}
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build:
      context: .
      target: bot
    container_name: arqon_bot
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-arqon_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-arqon_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "127.0.0.1:${HEALTH_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    container_name: arqon_worker
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-arqon_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-arqon_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  arqon_pgdata:
  arqon_redisdata:
